name: Perl CI and export kit

# Public repo: holds NO deploy credentials. Dispatches the export-kit
# release workflow, which builds this repo's export kit at this exact
# SHA and ships it to kits.noisedeck.app.
#
# Pushes run the required source and distribution tests. Full runs also
# run the oracle parity tests and the whole-port PARITY-SUMMARY against the
# pinned noisemaker-for-cpu (on Linux and Windows), then release a kit, unless
# the SHA already carries a kit tag.

on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 1'
  push:
    branches: [main]
    paths:
      - "export-kit/**"
      - ".github/workflows/export-kit.yml"
      # LICENSE is shipped kit content (vendored into LICENSES/): a relicense must auto-publish.
      - "LICENSE"
      - "lib/**"
      - "bin/make-noise"
      - "t/**"
      - "scripts/**"
      - "Makefile.PL"
      - "MANIFEST*"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: export-kit-${{ github.ref }}-${{ github.event_name == 'push' && 'gate' || 'full' }}
  cancel-in-progress: false

jobs:
  test:
    name: Perl ${{ matrix.perl }} on ${{ matrix.os }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, perl: '5.22' }
          - { os: ubuntu-latest, perl: '5.42' }
          - { os: macos-latest, perl: '5.42' }
    defaults:
      run:
        working-directory: port
    env:
      NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
      RELEASE_TESTING: '1'
      HARNESS_OPTIONS: j2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: port
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@ac3202722f5744e62a8fa3af3e1aaaebb08861f3 # v1
        with:
          perl-version: ${{ matrix.perl }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Read reference revision
        id: oracle
        run: |
          perl -MJSON::PP -e 'local $/; my $p=decode_json(<>); die "Invalid oracle revision" unless $p->{revision} =~ /\A[0-9a-f]{40}\z/; print "revision=$p->{revision}\n"' scripts/oracle-lock.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: ${{ steps.oracle.outputs.revision }}
          path: oracle
          persist-credentials: false
      - name: Test source and packaged distribution
        run: |
          set -euo pipefail
          require_no_skips() {
            perl -ne 'die "Required test skipped: $_" if /#\s*SKIP\b|\bskipped:/i' "$1"
          }
          perl Makefile.PL
          make test TEST_VERBOSE=1 | tee "$RUNNER_TEMP/source-tests.log"
          require_no_skips "$RUNNER_TEMP/source-tests.log"
          make distcheck
          make disttest TEST_VERBOSE=1 | tee "$RUNNER_TEMP/distribution-tests.log"
          require_no_skips "$RUNNER_TEMP/distribution-tests.log"
      - name: Check public POD
        run: |
          perl -MPod::Checker=podchecker -e 'my $bad=0; for (@ARGV) { $bad++ if podchecker($_) > 0 } exit($bad ? 1 : 0)' lib/Math/Fractal/Noisemaker.pm lib/Math/Fractal/Noisemaker/*.pm lib/Math/Fractal/Noisemaker/Transpiler/Build.pm

  parity:
    name: Pinned CPU reference and PARITY-SUMMARY
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: port
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@ac3202722f5744e62a8fa3af3e1aaaebb08861f3 # v1
        with:
          perl-version: '5.42'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Read reference revision
        id: oracle
        run: |
          perl -MJSON::PP -e 'local $/; my $p=decode_json(<>); die "Invalid oracle revision" unless $p->{revision} =~ /\A[0-9a-f]{40}\z/; print "revision=$p->{revision}\n"' port/scripts/oracle-lock.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: ${{ steps.oracle.outputs.revision }}
          path: oracle
          persist-credentials: false
      - name: Oracle parity tests
        working-directory: port
        env:
          NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
          RELEASE_TESTING: '1'
        run: prove -l t/05-parity.t
      - name: Whole-port PARITY-SUMMARY, exact RGBA8 comparison
        working-directory: port
        env:
          NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
        run: perl scripts/parity-summary

  windows:
    name: Windows (Strawberry Perl) prove suite and PARITY-SUMMARY
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners convert line endings on checkout. The oracle's runtime
      # digest (scripts/ParityOracle.pm) covers its exact bytes, so check
      # every file out unconverted.
      - name: Check out files byte for byte
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: port
          persist-credentials: false
      - uses: shogo82148/actions-setup-perl@ac3202722f5744e62a8fa3af3e1aaaebb08861f3 # v1
        with:
          perl-version: '5.42'
          distribution: strawberry
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Read reference revision
        id: oracle
        run: |
          perl -MJSON::PP -e 'local $/; my $p=decode_json(<>); die "Invalid oracle revision" unless $p->{revision} =~ /\A[0-9a-f]{40}\z/; print "revision=$p->{revision}\n"' port/scripts/oracle-lock.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: ${{ steps.oracle.outputs.revision }}
          path: oracle
          persist-credentials: false
      # PowerShell, not Git Bash: under Bash, Strawberry's `prove` script runs
      # with MSYS's perl and its library.
      - name: Prove suite
        working-directory: port
        shell: pwsh
        env:
          NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
          RELEASE_TESTING: '1'
        run: |
          $env:NOISEMAKER_CPU_DIR = $env:NOISEMAKER_CPU_DIR.Replace('\', '/')
          $tapLog = Join-Path $env:RUNNER_TEMP 'windows-prove.log'
          perl -S prove -lrv t | Tee-Object -FilePath $tapLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          perl -ne 'die "Required test skipped: $_" if /#\s*SKIP\b|\bskipped:/i' $tapLog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Whole-port PARITY-SUMMARY, exact RGBA8 comparison
        working-directory: port
        shell: pwsh
        env:
          NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
        run: perl scripts/parity-summary

  perl32:
    name: Perl 5.44 native i386 prove suite and PARITY-SUMMARY
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 180
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: port
    env:
      NOISEMAKER_CPU_DIR: ${{ github.workspace }}/oracle
      RELEASE_TESTING: '1'
      HARNESS_OPTIONS: j2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: port
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Read reference revision
        id: oracle
        run: |
          perl -MJSON::PP -e 'local $/; my $p=decode_json(<>); die "Invalid oracle revision" unless $p->{revision} =~ /\A[0-9a-f]{40}\z/; print "revision=$p->{revision}\n"' scripts/oracle-lock.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: noisefactorllc/noisemaker-for-cpu
          ref: ${{ steps.oracle.outputs.revision }}
          path: oracle
          persist-credentials: false
      - name: Build official Perl with a native IA32 toolchain
        run: |
          set -euo pipefail
          unset HARNESS_PERL PERL5OPT PERL5LIB
          export PERL32_PREFIX="$RUNNER_TEMP/perl544-i386"
          test "$(uname -m)" = x86_64
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib libc6-dev-i386 libcrypt-dev:i386
          dpkg-query -W gcc gcc-multilib gcc-13-multilib libc6-dev-i386 libc6-i386 libcrypt-dev:i386 libcrypt1:i386
          gcc --version
          sha256sum "$(command -v gcc)" "$(gcc -print-prog-name=cc1)" "$(command -v make)" "$(command -v as)" "$(command -v ld)"
          cat > "$RUNNER_TEMP/observe-perl32.py" <<'PY'
          import ctypes, hashlib, json, os, platform, signal, struct, subprocess, sys
          from pathlib import Path

          libc = ctypes.CDLL(None, use_errno=True)
          libc.ptrace.argtypes = [ctypes.c_uint, ctypes.c_uint, ctypes.c_void_p, ctypes.c_void_p]
          libc.ptrace.restype = ctypes.c_long

          def ptrace(request, pid, data=0):
              if libc.ptrace(request, pid, None, ctypes.c_void_p(data)) == -1:
                  error = ctypes.get_errno()
                  raise OSError(error, os.strerror(error))

          def elf(path):
              header = Path(path).read_bytes()[:20]
              if header[:4] != b'\x7fELF' or len(header) != 20 or header[5] != 1:
                  raise RuntimeError(f'Not a little-endian ELF: {path}')
              return header[4], int.from_bytes(header[18:20], 'little')

          def validate_maps(text, target, loader):
              executable = set()
              for line in text.splitlines():
                  fields = line.split(None, 5)
                  if len(fields) == 6 and 'x' in fields[1] and fields[5].startswith('/'):
                      mapped = Path(fields[5]).resolve(strict=True)
                      if elf(mapped) != (1, 3):
                          raise RuntimeError(f'Non-i386 executable mapping: {mapped}')
                      executable.add(mapped)
              if target not in executable or loader not in executable:
                  raise RuntimeError('Required target and native ELF32 loader executable mappings are absent')

          def require_native(pid, target, loader, expected_sha, role):
              proc_exe = Path(f'/proc/{pid}/exe')
              kernel_exe = Path(os.readlink(proc_exe))
              if kernel_exe != target or elf(proc_exe) != (1, 3):
                  raise RuntimeError(f'{role} is not the native ELF32 i386 target: {kernel_exe}')
              digest = hashlib.sha256(proc_exe.read_bytes()).hexdigest()
              if digest != expected_sha:
                  raise RuntimeError(f'{role} interpreter digest mismatch')
              maps = Path(f'/proc/{pid}/maps').read_text()
              validate_maps(maps, target, loader)
              print(json.dumps({'role': role, 'pid': pid, 'kernel_exe': str(kernel_exe),
                                'elf_class': 32, 'elf_machine': 3, 'sha256': digest,
                                'native_loader': str(loader),
                                'loader_sha256': hashlib.sha256(loader.read_bytes()).hexdigest(),
                                'maps': maps.splitlines()}), flush=True)

          def trace_command(command, on_exec, follow):
              def traceme():
                  try:
                      ptrace(0, 0)
                  except OSError as error:
                      os.write(2, f'Native exec observation unavailable: {error}\n'.encode())
                      os._exit(125)
              process = subprocess.Popen(command, preexec_fn=traceme)
              traced = {process.pid}
              newborn = set()
              try:
                  pid, status = os.waitpid(process.pid, os.WUNTRACED)
                  if not os.WIFSTOPPED(status) or os.WSTOPSIG(status) != signal.SIGTRAP:
                      if os.WIFEXITED(status) or os.WIFSIGNALED(status):
                          process.returncode = os.waitstatus_to_exitcode(status)
                          traced.discard(pid)
                      raise RuntimeError(f'Executable did not reach its deterministic exec stop: {status}')
                  ptrace(0x4200, pid, 0x100000 | (0x2 | 0x4 | 0x10 if follow else 0))
                  on_exec(pid, True)
                  if not follow:
                      ptrace(17, pid)
                      traced.clear()
                      return process.wait()
                  ptrace(7, pid)
                  while traced:
                      pid, status = os.waitpid(-1, 0x40000000)
                      if os.WIFEXITED(status) or os.WIFSIGNALED(status):
                          traced.discard(pid)
                          if pid == process.pid:
                              process.returncode = os.waitstatus_to_exitcode(status)
                          continue
                      if not os.WIFSTOPPED(status):
                          raise RuntimeError(f'Unexpected tracing wait status: {status}')
                      event = status >> 16
                      stopped_signal = os.WSTOPSIG(status)
                      if event in (1, 2):
                          child = ctypes.c_ulong()
                          ptrace(0x4201, pid, ctypes.addressof(child))
                          traced.add(child.value)
                          newborn.add(child.value)
                      if event == 4:
                          on_exec(pid, pid == process.pid)
                      injected = 0 if event else stopped_signal
                      if pid in newborn and stopped_signal == signal.SIGSTOP:
                          newborn.remove(pid)
                          injected = 0
                      ptrace(7, pid, injected)
                  if process.returncode is None:
                      raise RuntimeError('Observed command has no final exit status')
                  return process.returncode
              except BaseException:
                  for pid in traced:
                      try:
                          os.kill(pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                  while traced:
                      try:
                          pid, status = os.waitpid(-1, 0x40000000)
                      except ChildProcessError:
                          break
                      if os.WIFSTOPPED(status):
                          if status >> 16 in (1, 2):
                              child = ctypes.c_ulong()
                              ptrace(0x4201, pid, ctypes.addressof(child))
                              traced.add(child.value)
                              os.kill(child.value, signal.SIGKILL)
                          os.kill(pid, signal.SIGKILL)
                      else:
                          traced.discard(pid)
                          if pid == process.pid:
                              process.returncode = os.waitstatus_to_exitcode(status)
                  raise

          def main():
              if struct.calcsize('P') != 8 or platform.machine() != 'x86_64' or elf('/proc/self/exe') != (2, 62):
                  raise RuntimeError('Observer must be a native ELF64 x86-64 process')
              phase, *command = sys.argv[1:]
              target = Path(command[0]).resolve(strict=True)
              loader = Path('/lib/ld-linux.so.2').resolve(strict=True)
              if elf(target) != (1, 3) or elf(loader) != (1, 3):
                  raise RuntimeError('Target and native loader must be ELF32 EM_386, not x32 or 64-bit')
              expected_sha = hashlib.sha256(target.read_bytes()).hexdigest()
              print(json.dumps({'observer': os.readlink('/proc/self/exe'), 'pointer_bytes': 8,
                                'phase': phase, 'argv': command}), flush=True)
              child_seen = phase not in ('prove', 'summary')
              def observe(pid, is_root):
                  nonlocal child_seen
                  args = Path(f'/proc/{pid}/cmdline').read_bytes().split(b'\0')
                  wanted = any(arg.endswith(b'.t') for arg in args) if phase == 'prove' else any(arg.endswith(b'/parity.pl') for arg in args)
                  if is_root or (not child_seen and wanted):
                      require_native(pid, target, loader, expected_sha, phase if is_root else phase + '-child')
                      if not is_root:
                          child_seen = True
              status = trace_command(command, observe, phase in ('prove', 'summary'))
              if status:
                  raise SystemExit(status if status > 0 else 128 - status)
              if not child_seen:
                  raise RuntimeError(f'No actual {phase} Perl child was observed')

          if __name__ == '__main__':
              main()
          PY
          cat > "$RUNNER_TEMP/ia32-probe.c" <<'C'
          #include <stdio.h>
          #include <unistd.h>
          int main(void) {
              if (sizeof(void *) != 4) return 1;
              printf("IA32 pointer_bytes=%zu\n", sizeof(void *));
              fflush(stdout);
              return 0;
          }
          C
          gcc -m32 -msse2 -mfpmath=sse "$RUNNER_TEMP/ia32-probe.c" -o "$RUNNER_TEMP/ia32-probe"
          python3 "$RUNNER_TEMP/observe-perl32.py" probe "$RUNNER_TEMP/ia32-probe"
          build_dir="$RUNNER_TEMP/perl544-source"
          mkdir -p "$build_dir"
          curl --fail --location --retry 3 https://www.cpan.org/src/5.0/perl-5.44.0.tar.gz -o "$build_dir/perl-5.44.0.tar.gz"
          curl --fail --location --retry 3 https://www.cpan.org/src/5.0/perl-5.44.0.tar.gz.sha256.txt -o "$build_dir/published.sha256"
          expected_sha=3b855066b92491cb40e86affb1ca57d1a388aa43e51b91c7806a32c2f65f96c3
          test "$(tr -d '[:space:]' < "$build_dir/published.sha256")" = "$expected_sha"
          printf '%s  %s\n' "$expected_sha" "$build_dir/perl-5.44.0.tar.gz" | sha256sum -c -
          python3 - "$build_dir/perl-5.44.0.tar.gz" <<'PY'
          import sys, tarfile
          from pathlib import PurePosixPath
          with tarfile.open(sys.argv[1]) as archive:
              for entry in archive:
                  path = PurePosixPath(entry.name)
                  if path.is_absolute() or '..' in path.parts or not (entry.isfile() or entry.isdir()):
                      raise RuntimeError(f'Non-regular source archive member: {entry.name}')
          PY
          tar -xzf "$build_dir/perl-5.44.0.tar.gz" -C "$build_dir"
          cat > "$RUNNER_TEMP/copy-perl-alias" <<'SH'
          #!/bin/sh
          set -eu
          while [ "${1:-}" = -f ] || [ "${1:-}" = -s ]; do shift; done
          test "$#" = 2
          alias_target=$1
          alias_path=$2
          case "$alias_target" in
            /*) copy_source=$alias_target ;;
            *) copy_source=$(dirname "$alias_path")/$alias_target ;;
          esac
          if [ ! -f "$copy_source" ] && [ -f "$alias_target" ]; then copy_source=$alias_target; fi
          exec /bin/cp -L "$copy_source" "$alias_path"
          SH
          chmod 755 "$RUNNER_TEMP/copy-perl-alias"
          cd "$build_dir/perl-5.44.0"
          time sh Configure -des -Dprefix="$PERL32_PREFIX" -Dcc='gcc -m32 -msse2 -mfpmath=sse' -Uuse64bitint -Uuse64bitall -Uinstallusrbinperl -Dln="$RUNNER_TEMP/copy-perl-alias" -Dlns="$RUNNER_TEMP/copy-perl-alias" -Dman1dir=none -Dman3dir=none
          time make -j2
          time make install
          test -z "$(find "$PERL32_PREFIX" -type l -print -quit)"
          sha256sum "$PERL32_PREFIX/bin/perl"
          "$PERL32_PREFIX/bin/perl" -V
          python3 "$RUNNER_TEMP/observe-perl32.py" abi "$PERL32_PREFIX/bin/perl" -MConfig <<'PL'
            die "Unexpected Perl ABI" unless $Config{version} eq "5.44.0" && $Config{ptrsize} == 4 && $Config{ivsize} == 4 && $Config{nvsize} == 8;
            die "Unexpected configured child interpreter" unless $Config{perlpath} eq "$ENV{PERL32_PREFIX}/bin/perl";
            open my $exe, "<:raw", "/proc/self/exe" or die $!; read $exe, my $header, 20;
            die "Unexpected process ELF" unless substr($header,0,5) eq "\x7fELF\x01" && unpack("v",substr($header,18,2)) == 3;
            print "executable=$^X perlpath=$Config{perlpath} arch=$Config{archname} ptr=$Config{ptrsize} IV=$Config{ivsize} NV=$Config{nvsize}\n";
          PL
          printf '%s\n' "$PERL32_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'PERL32_PREFIX=%s\n' "$PERL32_PREFIX" >> "$GITHUB_ENV"
      - name: Qualify the native 32-bit interpreter
        run: |
          set -euo pipefail
          unset HARNESS_PERL PERL5OPT PERL5LIB NOISEMAKER_CPU_SYNC_CASES NM_CHANGED_FILES
          export PATH="$PERL32_PREFIX/bin:$PATH"
          test "$(command -v perl)" = "$PERL32_PREFIX/bin/perl"
          test "$(command -v prove)" = "$PERL32_PREFIX/bin/prove"
          printf 'PATH=%s\n' "$PATH"
          head -1 "$PERL32_PREFIX/bin/prove"
          "$PERL32_PREFIX/bin/perl" -Iscripts -MParityOracle=verify_oracle -MJSON::PP <<'PL'
          print encode_json(verify_oracle($ENV{NOISEMAKER_CPU_DIR})),"\n";
          PL
          node --input-type=module - "$NOISEMAKER_CPU_DIR/src/effects/generated/upstream-snapshot.js" > "$RUNNER_TEMP/perl32-authority.json" <<'JS'
          import { pathToFileURL } from 'node:url'
          const snapshot = await import(pathToFileURL(process.argv[2]).href)
          console.log(JSON.stringify({ ids: snapshot.sourceEffectIds, revision: snapshot.UPSTREAM_REVISION }))
          JS
          python3 "$RUNNER_TEMP/observe-perl32.py" cli "$PERL32_PREFIX/bin/perl" bin/make-noise generate synth/solid --width 2 --height 2 --filename "$RUNNER_TEMP/perl32-cli.png"
          test -s "$RUNNER_TEMP/perl32-cli.png"
          export PERL_TEST_HARNESS_DUMP_TAP="$RUNNER_TEMP/perl32-tap"
          python3 "$RUNNER_TEMP/observe-perl32.py" prove "$PERL32_PREFIX/bin/perl" "$PERL32_PREFIX/bin/prove" -lrv t 2>&1 | tee "$RUNNER_TEMP/perl32-prove.log"
          "$PERL32_PREFIX/bin/perl" -n - "$RUNNER_TEMP/perl32-prove.log" <<'PL'
          die "Required test skipped: $_" if /#\s*SKIP\b|\bskipped:/i;
          PL
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          for test in Path('t').rglob('*.t'):
              tap = Path(os.environ['PERL_TEST_HARNESS_DUMP_TAP']) / test
              if not tap.is_file():
                  raise RuntimeError(f'Missing required TAP receipt: {test}')
              text = tap.read_text()
              if not text.strip() or re.search(r'#\s*SKIP\b|\bskipped:|^not ok\b|^Bail out!', text, re.I | re.M):
                  raise RuntimeError(f'Required test failed or skipped: {test}')
          PY
          python3 "$RUNNER_TEMP/observe-perl32.py" summary "$PERL32_PREFIX/bin/perl" scripts/parity-summary 2>&1 | tee "$RUNNER_TEMP/perl32-summary.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          pin = json.loads(Path('scripts/oracle-lock.json').read_text())
          authority = json.loads((base / 'perl32-authority.json').read_text())
          count = len(authority['ids'])
          if not count or len(set(authority['ids'])) != count or authority['revision'] != pin['upstream_revision']:
              raise RuntimeError('Invalid pinned authority manifest')
          lines = [line.removeprefix('PARITY-SUMMARY ') for line in (base / 'perl32-summary.log').read_text().splitlines() if line.startswith('PARITY-SUMMARY ')]
          if len(lines) != 1:
              raise RuntimeError('Expected exactly one complete PARITY-SUMMARY')
          summary = json.loads(lines[0])
          for key in ('expected', 'executed', 'exact'):
              if type(summary.get(key)) is not int or summary[key] != count:
                  raise RuntimeError(f'Incomplete exact parity: {key}')
          for key in ('strict', 'near', 'defer', 'skip', 'fail', 'missing'):
              if type(summary.get(key)) is not int or summary[key] != 0:
                  raise RuntimeError(f'Non-exact parity: {key}')
          if summary.get('authorityRevision') != authority['revision']:
              raise RuntimeError('PARITY-SUMMARY authority mismatch')
          print(json.dumps(summary, sort_keys=True))
          PY

  dispatch:
    needs: [test, parity, windows, perl32]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The release mints a new kit version for every dispatch, so a weekly run on
      # an unchanged main must not release the same SHA again. A tag listing
      # names the commit itself (lightweight or peeled annotated tag).
      - name: Skip a SHA that is already released
        id: released
        timeout-minutes: 5
        env:
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          tags=$(git ls-remote --tags "https://github.com/$REPO.git" 'refs/tags/kit-*')
          if printf '%s\n' "$tags" | awk '{ print $1 }' | grep -qx "$SHA"; then
            echo "$SHA already carries a kit tag; nothing to release."
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the release dispatch configuration
        if: steps.released.outputs.released == 'false'
        env:
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          missing=""
          [ -n "$RELEASE_REPOSITORY" ] || missing="$missing RELEASE_REPOSITORY"
          [ -n "$EXPORT_KIT_RELEASE_WORKFLOW" ] || missing="$missing EXPORT_KIT_RELEASE_WORKFLOW"
          if [ -n "$missing" ]; then
            echo "::error::The release dispatch is not configured. Empty or unset secret(s):$missing"
            exit 1
          fi

      - name: Mint release-dispatch token
        if: steps.released.outputs.released == 'false'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liy6T6BW0BXuZRzx
          private-key: ${{ secrets.EHSRE_APP_PRIVATE_KEY }}
          owner: noisefactorllc
          repositories: ${{ secrets.RELEASE_REPOSITORY }}

      - name: Dispatch the export-kit release
        if: steps.released.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_REPOSITORY: ${{ secrets.RELEASE_REPOSITORY }}
          EXPORT_KIT_RELEASE_WORKFLOW: ${{ secrets.EXPORT_KIT_RELEASE_WORKFLOW }}
        run: |
          gh workflow run "$EXPORT_KIT_RELEASE_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY_OWNER/$RELEASE_REPOSITORY" \
            --ref main \
            -f kit=perl \
            -f sha=${{ github.sha }}
